customHeaders:
  - pattern: '**/*'
    headers:
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'Referrer-Policy'
        value: 'no-referrer'
      - key: 'Content-Security-Policy'
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://world.openfoodfacts.org; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
      - key: 'Cache-Control'
        value: 'no-cache'
